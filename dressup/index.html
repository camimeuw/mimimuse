<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dress up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
:root{
  --ink:#3a1f6b;       /* violeta noche: bordes y texto */
  --violet:#8b5cf6;
  --lilac:#cdbcff;
  --pink:#ff7ab8;
  --pink-soft:#ffd3ea;
  --cream:#fff6fb;
  --bg:#ffc2e0;
  --pixel:'DotGothic16','MS Gothic','Courier New',monospace;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:var(--pixel);color:var(--ink);
  background:
    radial-gradient(var(--pink) 2px,transparent 2.5px) 0 0/22px 22px,
    linear-gradient(var(--bg),var(--pink-soft));
  display:grid;place-items:center;padding:16px;
}
/* ventana estilo menú de RPG */
.win{
  background:var(--cream);
  border:4px solid var(--ink);
  box-shadow:inset 0 0 0 3px var(--cream),inset 0 0 0 6px var(--violet),6px 6px 0 var(--ink);
}
.game{display:grid;gap:20px;grid-template-columns:auto minmax(300px,380px);align-items:center;max-width:900px;width:100%;justify-content:center}

/* escenario */
.stage{
  position:relative;padding:14px;
  background:
    radial-gradient(var(--lilac) 1.5px,transparent 2px) 0 0/14px 14px,
    var(--cream);
}
.doll{
  position:relative;width:calc(min(78vh,720px) * 730 / 1790);aspect-ratio:730/1790;
  margin:0 auto;
}
.doll img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.doll.pop{animation:pop .35s steps(4)}
@keyframes pop{50%{transform:translateY(-8px) scale(1.02)}}
.floor{
  position:absolute;left:50%;bottom:10px;width:62%;height:22px;translate:-50% 0;
  border-radius:50%;background:var(--lilac);border:3px solid var(--ink);opacity:.9;
}

/* panel de menú */
.menu{padding:20px 18px 22px;display:grid;gap:14px}
h1{font-weight:400;font-size:34px;line-height:1;text-align:center;letter-spacing:.04em;color:var(--violet);
   text-shadow:3px 3px 0 var(--pink-soft),4px 4px 0 var(--ink)}
.hint{font-size:15px;text-align:center}
.row{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center}
.pick{
  min-height:56px;padding:6px 8px;text-align:center;background:var(--pink-soft);
  border:3px solid var(--ink);display:grid;gap:2px;align-content:center;
}
.pick b{font-weight:400;font-size:13px;color:var(--violet)}
.pick span{font-size:17px;line-height:1.1}
button{
  font:inherit;color:var(--ink);cursor:pointer;touch-action:manipulation;
  border:3px solid var(--ink);background:var(--pink);
  box-shadow:0 4px 0 var(--ink);min-height:48px;
}
button:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
button:focus-visible{outline:4px solid var(--violet);outline-offset:3px}
.arrow{font-size:22px;background:var(--lilac)}
.random{
  margin-top:4px;font-size:22px;letter-spacing:.06em;background:var(--violet);color:var(--cream);
  min-height:56px;
}

@media (max-width:760px){
  body{padding:10px;place-items:start center}
  .game{grid-template-columns:1fr;gap:16px}
  .doll{width:calc(min(40vh,420px) * 730 / 1790)}
  .stage{padding:8px}
  .floor{bottom:6px;height:16px}
  .menu{padding:14px 14px 16px;gap:10px}
  .row{margin-bottom:0!important}
  .hint:first-of-type{display:none}
  h1{font-size:28px}
}
@media (prefers-reduced-motion:reduce){.doll.pop{animation:none}}
</style>
</head>
<body>
<main class="game">
  <section class="stage win" aria-label="Modelo">
    <div class="doll" id="doll"></div>
    <div class="floor"></div>
  </section>

  <section class="menu win" aria-label="Elegí la ropa">
    <h1>dress up!</h1>
    <p class="hint">elegí la ropa con las flechas</p>
    <div id="rows"></div>
    <button class="random" id="random" type="button">random</button>
    <p class="hint" id="live" aria-live="polite"></p>
  </section>
</main>

/* ---------------- código ---------------- */
const state = { arriba: 0, abajo: 0, zapatos: 0 };
const doll = document.getElementById('doll');
const imgs = {};

function layer(src, alt) {
  const i = new Image(); i.src = src; i.alt = alt; i.width = W; i.height = H; i.draggable = false;
  doll.appendChild(i); return i;
}
layer(MODELO, 'Modelo');
ORDER.forEach(k => { imgs[k] = layer(CLOTHES[k][0].src, ''); });

const rows = document.getElementById('rows');
const els = {};
Object.keys(CLOTHES).forEach(k => {
  const row = document.createElement('div'); row.className = 'row'; row.style.marginBottom = '10px';
  row.innerHTML = `
    <button class="arrow" type="button" aria-label="${LABELS[k]} anterior">◀</button>
    <div class="pick"><b>${LABELS[k]}</b><span></span></div>
    <button class="arrow" type="button" aria-label="${LABELS[k]} siguiente">▶</button>`;
  const [prev, , next] = row.children;
  prev.onclick = () => step(k, -1);
  next.onclick = () => step(k, +1);
  els[k] = row.querySelector('.pick span');
  rows.appendChild(row);
});

function render() {
  Object.keys(CLOTHES).forEach(k => {
    const list = CLOTHES[k], item = list[state[k]];
    imgs[k].src = item.src;
    imgs[k].alt = item.name;
    els[k].textContent = `${item.name}  ${state[k] + 1}/${list.length}`;
  });
}
function step(k, d) {
  const n = CLOTHES[k].length;
  state[k] = (state[k] + d + n) % n;  // loop
  render();
}
render();

const live = document.getElementById('live');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd = n => Math.floor(Math.random() * n);
document.getElementById('random').onclick = () => {
  const final = {}; Object.keys(CLOTHES).forEach(k => final[k] = rnd(CLOTHES[k].length));
  const finish = () => {
    Object.assign(state, final); render();
    live.textContent = Object.keys(CLOTHES).map(k => CLOTHES[k][state[k]].name).join(', ');
    if (!reduce) { doll.classList.remove('pop'); void doll.offsetWidth; doll.classList.add('pop'); }
  };
  if (reduce) return finish();
  let t = 0;
  const id = setInterval(() => {   // barajada rápida antes de elegir
    Object.keys(CLOTHES).forEach(k => state[k] = rnd(CLOTHES[k].length)); render();
    if (++t >= 6) { clearInterval(id); finish(); }
  }, 70);
};
</script>
