<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mimi Muse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap">
  <link rel="stylesheet" href="css/splash.css">
  <link rel="stylesheet" href="css/main.css">
  <script>
    // Sin splash si la persona pidió menos movimiento
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('splash-on');
  </script>
</head>
<body>
  <div class="splash" aria-hidden="true"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol></svg>

  <div class="page home">
    <div class="main">
      <header class="top">
        <h1 class="logo">
          <img src="assets/logo.png" alt="Mimi Muse" width="866" height="620">
          <svg class="wink" viewBox="0 0 100 100" aria-hidden="true">
        <defs><radialGradient id="piel"><stop offset=".82" stop-color="#fbecf3"/><stop offset="1" stop-color="#fbecf3" stop-opacity="0"/></radialGradient></defs>
        <circle cx="50" cy="50" r="50" fill="url(#piel)"/>
        <path d="M16 58 Q40 30 84 52" fill="none" stroke="#411d4b" stroke-width="7" stroke-linecap="round"/>
        <path d="M78 47 L90 40" fill="none" stroke="#411d4b" stroke-width="6" stroke-linecap="round"/>
      </svg>
        </h1>
        <button class="cart" type="button" aria-label="Carrito, 0 productos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V7a3 3 0 0 1 6 0v1"/></svg>
          <span class="cart-count" aria-hidden="true">0</span>
        </button>
      </header>

      <section class="player" aria-label="Reproductor de música">
        <button class="play" type="button" aria-label="Reproducir o pausar" aria-pressed="false">
          <svg class="i-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
        </button>
        <p class="song">Canción de Mimi Muse</p>
        <input class="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Progreso de la canción">
        <audio id="audio" src="assets/cancion.mp3" preload="none" loop></audio>
      </section>
    <nav class="tabs" aria-label="Secciones">
      <a class="tab" href="index.html" aria-current="page">Dress Up ✧</a>
      <a class="tab" href="productos.html">ver todos los productos →</a>
    </nav>

      <section class="dressup" data-scene="0" aria-label="Dress Up">
        <nav class="closet" aria-label="Closet">
          <h2>Closet</h2>
          <a class="slot" href="productos.html">TOP</a>
          <a class="slot" href="productos.html">BOTTOM</a>
          <a class="slot" href="productos.html">SHOES</a>
          <a class="slot" href="productos.html">ACC</a>
        </nav>

        <div class="model">
          <div class="photo"><p class="look-name" aria-live="polite">Look 1</p></div>
          <button class="arrow prev" type="button" data-look="-1" aria-label="Look anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#chev"/></svg></button>
          <button class="arrow next" type="button" data-look="1" aria-label="Look siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#chev"/></svg></button>
          <div class="dots">
            <button type="button" data-dot="0" aria-label="Look 1" aria-current="true"></button>
            <button type="button" data-dot="1" aria-label="Look 2"></button>
            <button type="button" data-dot="2" aria-label="Look 3"></button>
          </div>
        </div>

        <div class="mimi-mode">
          <h2>Mimi Mode</h2>
          <div class="room" role="img" aria-label="Fondo actual"></div>
          <div class="scene-btns">
            <button class="scene-prev" type="button" data-scene="-1" aria-label="Fondo anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#chev"/></svg></button>
            <button type="button" data-scene="1" aria-label="Fondo siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#chev"/></svg></button>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="js/splash.js"></script>
  <script src="js/player.js"></script>
  <script src="js/dressup.js"></script>
</body>
</html>
