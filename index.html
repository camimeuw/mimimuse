<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mimi Muse</title>
  <link rel="stylesheet" href="css/splash.css">
  <script>
    // Sin splash si la persona pidió menos movimiento
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('splash-on');
  </script>
</head>
<body>
  <div class="splash" aria-hidden="true"></div>

  <header>
    <h1 class="logo">
      <img src="assets/logo.png" alt="Mimi Muse" width="866" height="620">
      <svg class="wink" viewBox="0 0 100 100" aria-hidden="true">
        <ellipse cx="50" cy="50" rx="46" ry="46" fill="#fbecf3"/>
        <path d="M14 62 Q50 20 86 62" fill="none" stroke="#411d4b" stroke-width="10" stroke-linecap="round"/>
      </svg>
    </h1>
  </header>

  <script src="js/splash.js"></script>
</body>
</html>
